version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: insurance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume persists database data across container
      # recreations (e.g. `docker compose down` + `up`) -- data is
      # only lost if the volume itself is explicitly removed.
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - insurance_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env to guarantee
      # the backend always talks to the 'postgres' service name (Docker's
      # internal DNS), not a value meant for local (non-Docker) development.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      # Persists uploaded documents outside the container's writable
      # layer, so files survive container recreation/redeploys.
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - insurance_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passed as a build arg since Vite needs it at BUILD time (see
        # frontend/Dockerfile comment). Points to the backend's HOST-side
        # published port, since this is what the user's browser (outside
        # Docker's internal network) actually calls.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: insurance_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - insurance_network

networks:
  insurance_network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads: